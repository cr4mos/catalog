name: iOS CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ios-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────
  # SwiftLint
  # ─────────────────────────────
  lint:
  name: SwiftLint
  runs-on: macos-latest

  steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint on changed files
      shell: bash
      run: |
        echo "Base branch: ${{ github.base_ref }}"

        FILES=$(git diff \
          --name-only \
          --diff-filter=ACMR \
          "origin/${{ github.base_ref }}...HEAD" \
          -- '*.swift')

        if [ -z "$FILES" ]; then
          echo "No Swift files changed."
          exit 0
        fi

        echo "Swift files changed:"
        echo "$FILES"

        FAILED=0

        while IFS= read -r file; do
          echo ""
          echo "Linting: $file"

          if ! swiftlint lint --strict "$file"; then
            FAILED=1
          fi
        done <<< "$FILES"

        exit $FAILED


  # ─────────────────────────────
  # Build + Tests
  # ─────────────────────────────
  build-and-test:
    name: Build & Tests
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project productsCatalogTest.xcodeproj \
            -scheme productsCatalogTest

      - name: Build
        run: |
          xcodebuild \
            -project productsCatalogTest.xcodeproj \
            -scheme productsCatalogTest \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Run tests
        run: |
          DEVICE=$(xcrun simctl list devices available \
            | grep "iPhone" \
            | head -1 \
            | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')

          echo "Using simulator: $DEVICE"

          xcodebuild \
            -project productsCatalogTest.xcodeproj \
            -scheme productsCatalogTest \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -configuration Debug \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            test
