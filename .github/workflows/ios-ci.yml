name: iOS CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Validate all Swift sources
        run: swiftlint lint --strict --no-cache

  build-and-test:
    name: Build & Tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Select available iPhone simulator
        shell: bash
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          devices = json.loads((Path(os.environ["RUNNER_TEMP"]) / "simulators.json").read_text())["devices"]
          iphones = [
              device for runtime, entries in devices.items()
              if ".iOS-" in runtime and int(runtime.split(".iOS-")[1].split("-")[0]) >= 17
              for device in entries
              if device["isAvailable"] and device["name"].startswith("iPhone")
          ]
          if not iphones:
              raise SystemExit("No available iPhone simulator with iOS 17 or later.")
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"SIMULATOR_ID={iphones[0]['udid']}\n")
          print(f"Selected: {iphones[0]['name']} ({iphones[0]['udid']})")
          PY
      - name: Build and run unit tests with coverage
        run: |
          xcodebuild \
            -project productsCatalogTest.xcodeproj \
            -scheme productsCatalogTest \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -configuration Debug \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: TestResults.xcresult
          if-no-files-found: warn
